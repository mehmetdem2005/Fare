name: Fare Running Belly Deformation Root-Cause Audit

on:
  push:
    branches:
      - rig-experiments/real-blender-ci
    paths:
      - rig-experiments/diagnose_run_belly.py
      - .github/workflows/fare-belly-diagnosis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abdominal-ablation-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts and original rig
        run: |
          set -euo pipefail
          python3 -m py_compile rig-experiments/animate_run.py rig-experiments/diagnose_run_belly.py
          test -s deliver/mouse_rig.blend
          mkdir -p RunOutput BellyAudit
      - name: Obtain official Blender 5.1.2 and Mesa virtual display
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz \
            https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libxi6 xvfb libxrender1
          blender_runtime/blender-5.1.2-linux-x64/blender --version | head -2
      - name: Reproduce exact Sprint v2 action with real Blender
        run: |
          set -euo pipefail
          blender_runtime/blender-5.1.2-linux-x64/blender -b \
            -P rig-experiments/animate_run.py -- \
            --source deliver/mouse_rig.blend --out RunOutput
          test -s RunOutput/mouse_run_sprint_v2.blend
          test -s RunOutput/run_qa.json
      - name: Run actual deformation ablations and side-by-side closeups
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender_runtime/blender-5.1.2-linux-x64/blender -b \
              -P rig-experiments/diagnose_run_belly.py -- \
              --source RunOutput/mouse_run_sprint_v2.blend --out BellyAudit
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("BellyAudit/belly_diagnosis.json")
          q=json.loads(p.read_text())
          assert q["status"]=="PASS",q.get("error")
          print("BLENDER BELLY DIAG:",q["pose_key_statistics"])
          print("ABLATON RANK:",q["ablation_mean_delta_fixed_belly_roi"])
          assert len(list(Path("BellyAudit/frames").glob("*.png")))==24
          PY
      - name: Upload diagnostics and selected original run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-belly-deformation-root-cause-qa
          path: |
            BellyAudit/**/*.png
            BellyAudit/*.json
            RunOutput/run_qa.json
          if-no-files-found: warn
          retention-days: 30
