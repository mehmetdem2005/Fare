name: Fare Round 24 spatially guarded 36 weight profiles all gait frames
on:
  push:
    branches: [rig-experiments/real-blender-ci]
    paths:
      - rig-experiments/round24_spatial_weight_guard.py
      - .github/workflows/fare-round24-spatial-mask-screen.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  exact-saved-model-spatial-masks:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify original and compile mathematical Blender experiments
        run: |
          set -euo pipefail
          echo '173ca67a372f5c04f27d922ef02f37921bbaf184cff0094976df326b4ec095b6  deliver/mouse_rig.blend' | sha256sum -c
          python3 -m py_compile rig-experiments/{round24_spatial_weight_guard.py,round20_full_cycle_geometry.py,round19e_clean_candidate_qa.py,round11_rootcause.py}
          mkdir -p Round24
      - name: Download original independently verified v8
        uses: actions/download-artifact@v4
        with:
          repository: mehmetdem2005/Fare
          run-id: 43767152372
          name: fare-round13-ik-phase-combined-review
          path: OriginalV8
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download saved original strength 0.170 weighting trial
        uses: actions/download-artifact@v4
        with:
          repository: mehmetdem2005/Fare
          run-id: 43867305596
          name: fare-round19d-clean-weight-readback-science
          path: Clean
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact v8 and rejected weight files
        run: |
          set -euo pipefail
          echo '984a21447c0217bc8ff91d02f9af1509324aa94dfaf29c543abd3d92f9b12c70  OriginalV8/Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend' | sha256sum -c
          echo 'cb67f61b9a1a771366df53b10b89e1bec827c81450e2bac300be2c96b52e85bc  Clean/Round19D_170/round19d_clean_0.170_REVIEW_ONLY.blend' | sha256sum -c
      - name: Install Blender 5.1.2 with numpy and actual mathutils
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libxi6 xvfb libxrender1
      - name: 36 spatial protected longitudinal profiles x 24 real evaluated frames
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/round24_spatial_weight_guard.py -- \
            --baseline OriginalV8/Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend \
            --candidate Clean/Round19D_170/round19d_clean_0.170_REVIEW_ONLY.blend \
            --out Round24
          python3 - <<'PY'
          import json
          r=json.load(open('Round24/round24_spatial_mask_screen.json'))
          assert r['status']=='PASS_HYPOTHESIS_SCREEN_NO_ANATOMY_APPROVAL',r.get('traceback')
          assert r['count']==36 and r['changed_vertices']==290
          assert r['checked_full_24_frames']
          assert r['unchanged_source_vertex_drift']<2e-5
          assert len(r['candidates'])==36
          print('Round24 complete. Numerical shortlist ONLY, NOT saved BLEND or L4:',r['strict_numeric_candidates'])
          PY
      - name: Always retain rejected variants and all per-frame diagnostic reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-round24-spatial-anatomical-mask-hypotheses
          path: Round24/
          retention-days: 30
          if-no-files-found: warn
