name: Fare Round 25 32 continuous hip and IK gait rescue candidates
on:
  push:
    branches: [rig-experiments/real-blender-ci]
    paths:
      - rig-experiments/round25_pose_phase_rescue.py
      - .github/workflows/fare-round25-phase-rescue.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  continuous-pose-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Compile and guarantee immutable production source
        run: |
          set -euo pipefail
          echo '173ca67a372f5c04f27d922ef02f37921bbaf184cff0094976df326b4ec095b6  deliver/mouse_rig.blend' | sha256sum -c
          python3 -m py_compile rig-experiments/{round25_pose_phase_rescue.py,round20_full_cycle_geometry.py,round19e_clean_candidate_qa.py}
          mkdir -p Round25
      - name: Download actual original v8 with original run action
        uses: actions/download-artifact@v4
        with:
          repository: mehmetdem2005/Fare
          run-id: 43767152372
          name: fare-round13-ik-phase-combined-review
          path: OriginalV8
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download original saved 0.170 review-only model
        uses: actions/download-artifact@v4
        with:
          repository: mehmetdem2005/Fare
          run-id: 43867305596
          name: fare-round19d-clean-weight-readback-science
          path: Clean
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require exact source file SHA digests
        run: |
          set -euo pipefail
          echo '984a21447c0217bc8ff91d02f9af1509324aa94dfaf29c543abd3d92f9b12c70  OriginalV8/Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend' | sha256sum -c
          echo 'cb67f61b9a1a771366df53b10b89e1bec827c81450e2bac300be2c96b52e85bc  Clean/Round19D_170/round19d_clean_0.170_REVIEW_ONLY.blend' | sha256sum -c
      - name: Install genuine Blender 5.1.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libxi6 xvfb libxrender1
      - name: Independently screen 32 true Blender 24+1-frame IK and hips profiles
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/round25_pose_phase_rescue.py -- \
            --baseline OriginalV8/Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend \
            --candidate Clean/Round19D_170/round19d_clean_0.170_REVIEW_ONLY.blend \
            --out Round25
          python3 - <<'PY'
          import json
          x=json.load(open('Round25/round25_full_cycle_pose_profiles.json'))
          assert x['status']=='PASS_CONTROLLED_24_FRAME_POSE_SCAN_NO_PRODUCTION_APPROVAL',x.get('traceback')
          assert x['attempted']==32 and x['profiles']==16 and x['checked_frames']==24,x
          assert all(r['metrics']['loop_seam']<1e-5 for r in x['attempts']),x
          print('Numerical L3 shortlist only, no saved production model',x['numerically_passing'])
          PY
      - name: Preserve negative constraints and time-profile experiments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-round25-32-continuous-IK-hip-pose-screen
          path: Round25/
          retention-days: 30
          if-no-files-found: warn
