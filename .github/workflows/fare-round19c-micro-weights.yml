name: Fare Round 19C micro-grid anatomical weight single-triangle area guard
on:
  push:
    branches: [rig-experiments/real-blender-ci]
    paths:
      - rig-experiments/round19c_micro_weight_area.py
      - .github/workflows/fare-round19c-micro-weights.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anatomical-weight-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source and Python syntax
        run: |
          set -euo pipefail
          echo '173ca67a372f5c04f27d922ef02f37921bbaf184cff0094976df326b4ec095b6  deliver/mouse_rig.blend' | sha256sum -c
          python3 -m py_compile rig-experiments/{round19c_micro_weight_area.py,round17_reopen_surface.py,round11_rootcause.py,round13_combined_ik.py,animate_run_v4.py,v4_flank_weight_trials.py,optimize_spine_phase.py,verify_phase_and_ik.py,reopen_verify_v7.py}
          mkdir -p Base Weight Optimization Verified Reopen Round13 Round19C
      - name: Install official Blender 5.1.2 and software renderer
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libxi6 xvfb libxrender1
      - name: Regenerate and independently reopen the actual verified v7
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/animate_run_v4.py -- --source deliver/mouse_rig.blend --out Base
          "$B" -b -P rig-experiments/v4_flank_weight_trials.py -- --source Base/mouse_run_sprint_v4.blend --out Weight
          "$B" -b -P rig-experiments/optimize_spine_phase.py -- --source Weight/mouse_sprint_v4_flank_65_EXPERIMENT.blend --out Optimization
          "$B" -b -P rig-experiments/verify_phase_and_ik.py -- --source Optimization/mouse_run_v6_spine_phase_REVIEW.blend --optimizer Optimization/spine_phase_optimization.json --out Verified
          "$B" -b -P rig-experiments/reopen_verify_v7.py -- --source Verified/fare_run_v7_verified_candidate.blend --expected Verified/independent_baked_validation.json --out Reopen
          python3 - <<'PYTHON'
          import json
          d=json.load(open('Reopen/reopened_v7_test.json'))
          assert d['status']=='PASS_TRUE_BAKED_SAME_AS_MANUAL',d
          PYTHON
      - name: Rebuild v8 from original, not any rejected v9/v10 assets
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender_runtime/blender-5.1.2-linux-x64/blender -b -P rig-experiments/round13_combined_ik.py -- \
             --source Verified/fare_run_v7_verified_candidate.blend --out Round13
          python3 - <<'PYTHON'
          import json
          d=json.load(open('Round13/round13_combined_ik.json'))
          assert d['status']=='PASS_NUMERIC_REVIEW_ONLY',d
          assert abs(d['baked_scores']['interleg']['worst']-1.0349695635654772)<1e-5,d
          PYTHON
      - name: Real Blender 32 anatomically constrained weight cases and DQS control
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/round19c_micro_weight_area.py -- \
             --source Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend --out Round19C
          python3 - <<'PYTHON'
          import json
          d=json.load(open('Round19C/round19c_anatomical_weights.json'))
          assert d['status'] in ('PASS_SCIENCE_13_MICRO_TRIALS_NO_SAFE_MINAREA','PASS_NUMERIC_SHORTLIST_REQUIRES_VISUAL_AND_REOPEN'),d.get('traceback')
          assert d['trial_count']==13,d
          assert d['return_to_baseline_drift']<3e-5,d
          assert len(d['trials'])==13,d
          print('fully screened',d['status'],'shortlist',bool(d.get('numeric_shortlist')))
          PYTHON
      - name: Preserve experiment evidence only, no changes to main or deliver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-round19c-micro-anatomical-weight-area
          path: |
            Round19C/
            Reopen/reopened_v7_test.json
            Round13/round13_combined_ik.json
          retention-days: 30
          if-no-files-found: warn
