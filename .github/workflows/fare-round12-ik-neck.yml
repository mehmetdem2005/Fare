name: Fare Round 12 targeted IK and neck-weight causal ablations
on:
  push:
    branches: [rig-experiments/real-blender-ci]
    paths:
      - rig-experiments/round12_ik_neck_ablation.py
      - .github/workflows/fare-round12-ik-neck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and script
        run: |
          set -euo pipefail
          python3 -m py_compile rig-experiments/{round11_rootcause.py,round12_ik_neck_ablation.py,animate_run_v4.py,v4_flank_weight_trials.py,optimize_spine_phase.py,verify_phase_and_ik.py,reopen_verify_v7.py}
          test -s deliver/mouse_rig.blend
          mkdir -p Base Weight Optimization Verified Reopen Round12
          sha256sum deliver/mouse_rig.blend > Round12/original_source.sha256
      - name: Official Blender 5.1.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
      - name: Rebuild and independently reopen 49-bone verified baseline
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/animate_run_v4.py -- --source deliver/mouse_rig.blend --out Base
          "$B" -b -P rig-experiments/v4_flank_weight_trials.py -- --source Base/mouse_run_sprint_v4.blend --out Weight
          "$B" -b -P rig-experiments/optimize_spine_phase.py -- --source Weight/mouse_sprint_v4_flank_65_EXPERIMENT.blend --out Optimization
          "$B" -b -P rig-experiments/verify_phase_and_ik.py -- --source Optimization/mouse_run_v6_spine_phase_REVIEW.blend --optimizer Optimization/spine_phase_optimization.json --out Verified
          "$B" -b -P rig-experiments/reopen_verify_v7.py -- --source Verified/fare_run_v7_verified_candidate.blend --expected Verified/independent_baked_validation.json --out Reopen
          python3 - <<'PY'
          import json
          r=json.load(open('Reopen/reopened_v7_test.json'))
          assert r['status']=='PASS_TRUE_BAKED_SAME_AS_MANUAL',r
          PY
      - name: Isolated IK target XYZ single controls, full gait ablations and neck-weight provenance
        run: |
          set -euo pipefail
          blender_runtime/blender-5.1.2-linux-x64/blender -b -P rig-experiments/round12_ik_neck_ablation.py -- \
            --source Verified/fare_run_v7_verified_candidate.blend --out Round12
          python3 - <<'PY'
          import json
          r=json.load(open('Round12/round12_ik_neck_ablation.json'))
          assert r['status']=='PASS_CAUSAL_EXPERIMENTS_NOT_A_REPAIR',r.get('traceback')
          assert r['ik_tests_count']==96,r['ik_tests_count']
          print('IK individual experiments',r['ik_tests_count'])
          print('Whole-cycle IK experiments',r['full_cycle_ik_profile_count'])
          PY
      - name: Preserve independently measured results, no production build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-round12-controlled-ik-and-neck-ablation
          path: |
            Round12/
            Reopen/reopened_v7_test.json
          retention-days: 30
          if-no-files-found: warn
