name: Fare Round 17 collapsed belly triangle area repair study
on:
  push:
    branches: [rig-experiments/real-blender-ci]
    paths:
      - rig-experiments/round17_area_microfold.py
      - rig-experiments/round17_reopen_surface.py
      - .github/workflows/fare-round17-area-microfold.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  area:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify original baseline and compile scripts
        run: |
          set -euo pipefail
          echo '173ca67a372f5c04f27d922ef02f37921bbaf184cff0094976df326b4ec095b6  deliver/mouse_rig.blend' | sha256sum -c
          python3 -m py_compile rig-experiments/{round17_area_microfold.py,round17_reopen_surface.py,round11_rootcause.py,round13_combined_ik.py,animate_run_v4.py,v4_flank_weight_trials.py,optimize_spine_phase.py,verify_phase_and_ik.py,reopen_verify_v7.py}
          mkdir -p Base Weight Optimization Verified Reopen Round13 Round17
      - name: Official Blender 5.1.2 and virtual renderer
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libxi6 xvfb libxrender1
      - name: Independently reconstruct and reopen verified v7
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/animate_run_v4.py -- --source deliver/mouse_rig.blend --out Base
          "$B" -b -P rig-experiments/v4_flank_weight_trials.py -- --source Base/mouse_run_sprint_v4.blend --out Weight
          "$B" -b -P rig-experiments/optimize_spine_phase.py -- --source Weight/mouse_sprint_v4_flank_65_EXPERIMENT.blend --out Optimization
          "$B" -b -P rig-experiments/verify_phase_and_ik.py -- --source Optimization/mouse_run_v6_spine_phase_REVIEW.blend --optimizer Optimization/spine_phase_optimization.json --out Verified
          "$B" -b -P rig-experiments/reopen_verify_v7.py -- --source Verified/fare_run_v7_verified_candidate.blend --expected Verified/independent_baked_validation.json --out Reopen
          python3 - <<'PYTHON'
          import json
          d=json.load(open('Reopen/reopened_v7_test.json'))
          assert d['status']=='PASS_TRUE_BAKED_SAME_AS_MANUAL',d
          PYTHON
      - name: Rebuild the same independent original v8, never use rejected v9 as baseline
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender_runtime/blender-5.1.2-linux-x64/blender -b -P rig-experiments/round13_combined_ik.py -- \
              --source Verified/fare_run_v7_verified_candidate.blend --out Round13
          python3 - <<'PYTHON'
          import json
          d=json.load(open('Round13/round13_combined_ik.json'))
          assert d['status']=='PASS_NUMERIC_REVIEW_ONLY',d
          assert abs(d['baked_scores']['interleg']['worst']-1.0349695635654772)<1e-5,d
          PYTHON
      - name: Restore compressed local triangle areas via pose-space correction 18 independent tests
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender_runtime/blender-5.1.2-linux-x64/blender -b -P rig-experiments/round17_area_microfold.py -- \
             --source Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend --out Round17
          python3 - <<'PYTHON'
          import json
          r=json.load(open('Round17/round17_area_microfold.json'))
          assert r['status'] in ('PASS_TESTED_18_TRIALS_NO_VALID_AREA_REPAIR','PASS_NUMERIC_AREA_REVIEW_ONLY'),r.get('traceback')
          assert len(r['trials'])==18
          if r['status']=='PASS_NUMERIC_AREA_REVIEW_ONLY':
            assert r['manual_vs_baked_max_error']<1e-4
          else:
            print('No acceptable area-constrained morph, correctly rejected')
          PYTHON
      - name: Fresh Blender reopen plus face-normal and BVH overlap differential
        run: |
          set -euo pipefail
          if [ -s Round17/round17_area_constrained_GAIT_ONLY_REVIEW.blend ]; then
            mkdir -p Round17Reopen
            B=blender_runtime/blender-5.1.2-linux-x64/blender
            "$B" -b -P rig-experiments/round17_reopen_surface.py -- \
              --source Round13/run_sprint_v8_ik_phase_NUMERIC_REVIEW.blend \
              --candidate Round17/round17_area_constrained_GAIT_ONLY_REVIEW.blend \
              --expected Round17/round17_area_microfold.json --out Round17Reopen
            python3 - <<'PYTHON'
          import json
          r=json.load(open('Round17Reopen/round17_independent_reopen_surface.json'))
          assert r['status'] in ('PASS_REOPEN_SURFACE_SCREEN_ONLY_NOT_PRODUCTION','PASS_REOPEN_BUT_FAIL_SURFACE_GEOMETRY'),r.get('traceback')
          assert r['max_original_drift']<2e-4
          assert r['max_candidate_drift']<2e-4
          print('Validated only L3/save-reopen, quality gate:',r['status'])
          PYTHON
          else
            echo "No numerically valid area candidate; no independent reopen"
          fi
      - name: Preserve test JSON, not main/production assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-round17-triangle-area-constrained-pose-tests
          path: |
            Round17/
            Round17Reopen/
            Reopen/reopened_v7_test.json
            Round13/round13_combined_ik.json
          retention-days: 30
          if-no-files-found: warn
