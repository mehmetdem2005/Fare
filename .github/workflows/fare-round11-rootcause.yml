name: Fare Round 11 isolated root-cause and corrective trials

on:
  push:
    branches: [rig-experiments/real-blender-ci]
    paths:
      - rig-experiments/round11_rootcause.py
      - .github/workflows/fare-round11-rootcause.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout only experiment branch
        uses: actions/checkout@v4
      - name: Verify source and compile scripts
        run: |
          set -euo pipefail
          test -s deliver/mouse_rig.blend
          python3 -m py_compile rig-experiments/{round11_rootcause.py,animate_run_v4.py,v4_flank_weight_trials.py,optimize_spine_phase.py,verify_phase_and_ik.py,reopen_verify_v7.py}
          mkdir -p Base Weight Optimization Verified Reopen Round11
          sha256sum deliver/mouse_rig.blend > Round11/source_original.sha256
      - name: Download real official Blender 5.1.2 and software-render libraries
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o blender.tar.xz https://mirror.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          mkdir blender_runtime
          tar -xJf blender.tar.xz -C blender_runtime
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libxi6 xvfb libxrender1
          blender_runtime/blender-5.1.2-linux-x64/blender --version | head -4
      - name: Reproduce independently verified 49-bone v7 candidate
        run: |
          set -euo pipefail
          B=blender_runtime/blender-5.1.2-linux-x64/blender
          "$B" -b -P rig-experiments/animate_run_v4.py -- --source deliver/mouse_rig.blend --out Base
          "$B" -b -P rig-experiments/v4_flank_weight_trials.py -- --source Base/mouse_run_sprint_v4.blend --out Weight
          "$B" -b -P rig-experiments/optimize_spine_phase.py -- --source Weight/mouse_sprint_v4_flank_65_EXPERIMENT.blend --out Optimization
          "$B" -b -P rig-experiments/verify_phase_and_ik.py -- --source Optimization/mouse_run_v6_spine_phase_REVIEW.blend --optimizer Optimization/spine_phase_optimization.json --out Verified
          "$B" -b -P rig-experiments/reopen_verify_v7.py -- --source Verified/fare_run_v7_verified_candidate.blend --expected Verified/independent_baked_validation.json --out Reopen
          python3 - <<'PY'
          import json
          r=json.load(open('Reopen/reopened_v7_test.json'))
          assert r['status']=='PASS_TRUE_BAKED_SAME_AS_MANUAL',r
          assert r['bone_count']==49 and r['vertex_count']==19466,r
          PY
      - name: Full evaluated-mesh bone sweep, isolated hotspot trials and actual Blender views
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            blender_runtime/blender-5.1.2-linux-x64/blender -b -P rig-experiments/round11_rootcause.py -- \
              --source Verified/fare_run_v7_verified_candidate.blend --out Round11
          python3 - <<'PY'
          import json,glob
          r=json.load(open('Round11/round11_rootcause.json'))
          assert r['status']=='PASS_L3_RESEARCH_NOT_PRODUCTION',r.get('error')
          assert r['bone_sweep_count']>300,r['bone_sweep_count']
          assert len(glob.glob('Round11/baseline_views/*.png'))>=8
          print('Round 11 critical',r['critical_frames'])
          print('Round 11 trial summary',r['numeric_shortlist'])
          PY
      - name: Preserve numerical audit and Blender renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fare-round11-isolated-bone-torso-rootcause
          path: |
            Round11/
            Reopen/reopened_v7_test.json
            Optimization/spine_phase_optimization.json
          retention-days: 30
          if-no-files-found: warn
